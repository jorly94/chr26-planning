function pad(n) { return String(n).padStart(2, "0"); }
function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function frDate(iso) { const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; }
function addDays(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoDate(d); }
function nowTime() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

async function loadAll() {
  const [c, e, i, a, q] = await Promise.all([
    sbClient.from("clients").select("*").order("created_at", { ascending: true }),
    sbClient.from("equipment").select("*").order("created_at", { ascending: true }),
    sbClient.from("interventions").select("*").order("created_at", { ascending: true }),
    sbClient.from("articles").select("*").order("label", { ascending: true }),
    sbClient.from("quotes").select("*").order("created_at", { ascending: true }),
  ]);
  if (c.error) throw c.error;
  if (e.error) throw e.error;
  if (i.error) throw i.error;
  if (a.error) throw a.error;
  if (q.error) throw q.error;
  return {
    clients: (c.data || []).map(dbClientToApp),
    equipment: (e.data || []).map(dbEquipmentToApp),
    interventions: (i.data || []).map(dbInterventionToApp),
    articles: (a.data || []).map(dbArticleToApp),
    quotes: (q.data || []).map(dbQuoteToApp),
  };
}

function App() {
  const [session, setSession] = useState(undefined); // undefined = chargement, null = déconnecté, objet = connecté
  const [clients, setClients] = useState(null);
  const [equipment, setEquipment] = useState(null);
  const [interventions, setInterventions] = useState(null);
  const [articles, setArticles] = useState(null);
  const [quotes, setQuotes] = useState(null);
  const [day, setDay] = useState(isoDate(new Date()));
  const [screen, setScreen] = useState({ name: "list" });
  const [saveError, setSaveError] = useState(null);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    sbClient.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sbClient.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) return;
    (async () => {
      try {
        const data = await loadAll();
        setClients(data.clients);
        setEquipment(data.equipment);
        setInterventions(data.interventions);
        setArticles(data.articles);
        setQuotes(data.quotes);
      } catch (e) {
        setSaveError("Impossible de charger les données : " + (e.message || String(e)));
        setClients([]); setEquipment([]); setInterventions([]); setArticles([]); setQuotes([]);
      }
    })();
  }, [session]);

  function flash() { setSaveError(null); setSaved(true); setTimeout(() => setSaved(false), 1200); }
  function fail(e) { console.error(e); setSaveError((e && e.message) || "Échec de l'enregistrement"); }

  if (session === undefined) {
    return <div className="h-screen flex items-center justify-center bg-white text-slate-400">Chargement…</div>;
  }
  if (session === null) {
    return <LoginScreen />;
  }

  if (clients === null || equipment === null || interventions === null || articles === null || quotes === null) {
    return <div className="h-screen flex items-center justify-center bg-white text-slate-400">Chargement…</div>;
  }

  const dayItems = interventions.filter((it) => it.date === day).slice().sort((a, b) => (a.time || "").localeCompare(b.time || ""));

  // ---- clients ----
  async function addClient(vals) {
    try {
      const { data, error } = await sbClient.from("clients").insert({ ...clientValsToPatch(vals), sites: [] }).select();
      if (error) throw error;
      const created = dbClientToApp(data[0]);
      setClients((prev) => [...prev, created]);
      flash();
      return created;
    } catch (e) { fail(e); return null; }
  }
  async function deleteClient(id) {
    try {
      const { error } = await sbClient.from("clients").delete().eq("id", id);
      if (error) throw error;
      setClients((prev) => prev.filter((c) => c.id !== id));
      setEquipment((prev) => prev.filter((e) => e.clientId !== id));
      flash();
    } catch (e) { fail(e); }
  }
  async function patchClient(clientId, patch) {
    try {
      const { data, error } = await sbClient.from("clients").update(patch).eq("id", clientId).select();
      if (error) throw error;
      const updated = dbClientToApp(data[0]);
      setClients((prev) => prev.map((c) => (c.id === clientId ? updated : c)));
      flash();
    } catch (e) { fail(e); }
  }
  function addSite(clientId, siteName) {
    const c = clients.find((c) => c.id === clientId);
    if (!c) return;
    patchClient(clientId, { sites: [...c.sites, siteName] });
  }
  function deleteSite(clientId, siteName) {
    const c = clients.find((c) => c.id === clientId);
    if (!c) return;
    patchClient(clientId, { sites: c.sites.filter((s) => s !== siteName) });
  }

  // ---- equipment ----
  async function addEquipment(clientId, code, label, model, serial) {
    try {
      const { data, error } = await sbClient.from("equipment").insert({ client_id: clientId, code, label, model, serial }).select();
      if (error) throw error;
      const created = dbEquipmentToApp(data[0]);
      setEquipment((prev) => [...prev, created]);
      flash();
      return created;
    } catch (e) { fail(e); return null; }
  }
  async function deleteEquipment(equipId) {
    try {
      const { error } = await sbClient.from("equipment").delete().eq("id", equipId);
      if (error) throw error;
      setEquipment((prev) => prev.filter((e) => e.id !== equipId));
      flash();
    } catch (e) { fail(e); }
  }

  // ---- interventions ----
  async function saveIntervention(item) {
    try {
      const body = {
        client: item.client, client_id: item.clientId || null, site: item.site,
        equipment: item.equipment, equipment_id: item.equipmentId || null,
        type: item.type, description: item.description, flags: item.flags,
        date: item.date, time: item.time, status: item.status || "attente",
        report: item.report || "", technician: item.technician || "Moi",
      };
      const isExisting = interventions.some((p) => p.id === item.id);
      if (isExisting) {
        const { data, error } = await sbClient.from("interventions").update(body).eq("id", item.id).select();
        if (error) throw error;
        const updated = dbInterventionToApp(data[0]);
        setInterventions((prev) => prev.map((p) => (p.id === updated.id ? updated : p)));
        flash();
        return updated;
      } else {
        const { data, error } = await sbClient.from("interventions").insert(body).select();
        if (error) throw error;
        const created = dbInterventionToApp(data[0]);
        setInterventions((prev) => [...prev, created]);
        flash();
        return created;
      }
    } catch (e) { fail(e); return null; }
  }
  async function deleteIntervention(id) {
    try {
      const { error } = await sbClient.from("interventions").delete().eq("id", id);
      if (error) throw error;
      setInterventions((prev) => prev.filter((p) => p.id !== id));
      flash();
    } catch (e) { fail(e); }
  }
  async function setInterventionStatus(id, status, report) {
    try {
      const patch = { status };
      if (typeof report === "string") patch.report = report;
      const { data, error } = await sbClient.from("interventions").update(patch).eq("id", id).select();
      if (error) throw error;
      const updated = dbInterventionToApp(data[0]);
      setInterventions((prev) => prev.map((p) => (p.id === updated.id ? updated : p)));
      flash();
      return updated;
    } catch (e) { fail(e); return null; }
  }

  // ---- articles ----
  async function addArticle(vals) {
    try {
      const { data, error } = await sbClient.from("articles").insert({
        reference: (vals.reference || "").trim(),
        label: (vals.label || "").trim(),
        purchase_price: parseFloat(vals.purchasePrice) || 0,
        sale_price: parseFloat(vals.salePrice) || 0,
        supplier: (vals.supplier || "").trim(),
        tva_rate: vals.tvaRate === "" || vals.tvaRate == null ? 20 : parseFloat(vals.tvaRate),
      }).select();
      if (error) throw error;
      const created = dbArticleToApp(data[0]);
      setArticles((prev) => [...prev, created].sort((a, b) => a.label.localeCompare(b.label)));
      flash();
      return created;
    } catch (e) { fail(e); return null; }
  }
  async function patchArticle(id, vals) {
    try {
      const { data, error } = await sbClient.from("articles").update({
        reference: (vals.reference || "").trim(),
        label: (vals.label || "").trim(),
        purchase_price: parseFloat(vals.purchasePrice) || 0,
        sale_price: parseFloat(vals.salePrice) || 0,
        supplier: (vals.supplier || "").trim(),
        tva_rate: vals.tvaRate === "" || vals.tvaRate == null ? 20 : parseFloat(vals.tvaRate),
      }).eq("id", id).select();
      if (error) throw error;
      const updated = dbArticleToApp(data[0]);
      setArticles((prev) => prev.map((a) => (a.id === id ? updated : a)).sort((a, b) => a.label.localeCompare(b.label)));
      flash();
    } catch (e) { fail(e); }
  }
  async function deleteArticle(id) {
    try {
      const { error } = await sbClient.from("articles").delete().eq("id", id);
      if (error) throw error;
      setArticles((prev) => prev.filter((a) => a.id !== id));
      flash();
    } catch (e) { fail(e); }
  }

  // ---- quotes ----
  async function getOrCreateQuote(intervention) {
    const existing = quotes.find((q) => q.interventionId === intervention.id);
    if (existing) return existing;
    try {
      const { data, error } = await sbClient.from("quotes").insert({
        client_id: intervention.clientId, equipment_id: intervention.equipmentId,
        intervention_id: intervention.id, items: [], status: "brouillon",
      }).select();
      if (error) throw error;
      const created = dbQuoteToApp(data[0]);
      setQuotes((prev) => [...prev, created]);
      return created;
    } catch (e) { fail(e); return null; }
  }
  async function updateQuote(quoteId, patch) {
    try {
      const dbPatch = { updated_at: new Date().toISOString() };
      if (patch.items) dbPatch.items = patch.items;
      if (patch.status) dbPatch.status = patch.status;
      const { data, error } = await sbClient.from("quotes").update(dbPatch).eq("id", quoteId).select();
      if (error) throw error;
      const updated = dbQuoteToApp(data[0]);
      setQuotes((prev) => prev.map((q) => (q.id === quoteId ? updated : q)));
      flash();
      return updated;
    } catch (e) { fail(e); return null; }
  }

  function openDate(iso) { setDay(iso); }

  return (
    <div className="h-screen w-full flex flex-col bg-white overflow-hidden select-none" style={{ fontFamily: "Inter, sans-serif" }}>
      {saveError && (
        <div className="bg-red-600 text-white text-[12px] px-3 py-1.5 shrink-0 flex items-center justify-between gap-2">
          <span className="truncate">⚠ {saveError}</span>
          <button onClick={() => setSaveError(null)} className="shrink-0 font-bold">✕</button>
        </div>
      )}
      {saved && !saveError && (
        <div className="bg-emerald-600 text-white text-[12px] px-3 py-1 shrink-0 text-center">✓ Enregistré</div>
      )}

      {screen.name === "list" && (
        <ListScreen
          day={day} setDay={openDate} items={dayItems}
          onNew={() => setScreen({ name: "form", item: null })}
          onOpen={(item) => setScreen({ name: "detail", item })}
          onNavClients={() => setScreen({ name: "clients" })}
          onNavArticles={() => setScreen({ name: "articles" })}
          onNavBackup={() => setScreen({ name: "backup" })}
        />
      )}

      {screen.name === "articles" && (
        <ArticlesScreen
          articles={articles}
          onBack={() => setScreen({ name: "list" })}
          onAdd={async (vals) => { await addArticle(vals); }}
          onEdit={async (id, vals) => { await patchArticle(id, vals); }}
          onDelete={async (id) => { if (window.confirm("Supprimer définitivement cet article ?")) await deleteArticle(id); }}
        />
      )}

      {screen.name === "clients" && (
        <ClientsScreen
          clients={clients}
          onBack={() => setScreen({ name: "list" })}
          onOpenClient={(c) => setScreen({ name: "client-detail", clientId: c.id })}
          onAddNew={() => setScreen({ name: "client-add-standalone" })}
          onDelete={async (id) => { if (window.confirm("Supprimer définitivement ce client ? Son matériel sera aussi supprimé ; ses interventions passées seront conservées mais détachées du client.")) await deleteClient(id); }}
        />
      )}

      {screen.name === "client-add-standalone" && (
        <AddScreen
          title="Nouveau client"
          fields={CLIENT_FIELDS}
          onCancel={() => setScreen({ name: "clients" })}
          onSave={async (vals) => {
            if (!vals.name.trim()) return;
            const c = await addClient(vals);
            if (c) setScreen({ name: "client-detail", clientId: c.id });
            else setScreen({ name: "clients" });
          }}
        />
      )}

      {screen.name === "client-edit" && (
        <AddScreen
          title="Modifier le client"
          saveLabel="Enregistrer"
          fields={CLIENT_FIELDS}
          initial={clients.find((c) => c.id === screen.clientId)}
          onCancel={() => setScreen({ name: "client-detail", clientId: screen.clientId })}
          onSave={async (vals) => {
            if (!vals.name.trim()) return;
            await patchClient(screen.clientId, clientValsToPatch(vals));
            setScreen({ name: "client-detail", clientId: screen.clientId });
          }}
        />
      )}

      {screen.name === "client-detail" && (
        <ClientDetailScreen
          client={clients.find((c) => c.id === screen.clientId)}
          equipmentList={equipment.filter((e) => e.clientId === screen.clientId)}
          interventionsList={interventions.filter((it) => it.clientId === screen.clientId)}
          quotes={quotes}
          onBack={() => setScreen({ name: "clients" })}
          onEdit={() => setScreen({ name: "client-edit", clientId: screen.clientId })}
          onOpenEquipment={(eq) => setScreen({ name: "equipment-history", equipmentId: eq.id, back: { name: "client-detail", clientId: screen.clientId } })}
          onOpenIntervention={(it) => setScreen({ name: "detail", item: it, back: { name: "client-detail", clientId: screen.clientId } })}
        />
      )}

      {screen.name === "equipment-history" && (
        <EquipmentHistoryScreen
          eq={equipment.find((e) => e.id === screen.equipmentId)}
          interventionsList={interventions.filter((it) => it.equipmentId === screen.equipmentId && it.status === "cloture")}
          onBack={() => setScreen(screen.back || { name: "list" })}
        />
      )}

      {screen.name === "detail" && (
        <InterventionDetailScreen
          item={screen.item}
          client={clients.find((c) => c.id === screen.item.clientId) || clients.find((c) => c.name === screen.item.client)}
          hasQuote={quotes.some((q) => q.interventionId === screen.item.id)}
          onBack={() => setScreen(screen.back || { name: "list" })}
          onEdit={() => setScreen({ name: "form", item: screen.item, back: screen.back })}
          onDelete={async (id) => { if (window.confirm("Supprimer définitivement cette intervention ?")) { await deleteIntervention(id); setScreen(screen.back || { name: "list" }); } }}
          onDevis={async (id) => {
            const u = await setInterventionStatus(id, "devis");
            if (u) { const q = await getOrCreateQuote(u); setScreen({ name: "quote", quoteId: q ? q.id : null, item: u, back: screen.back }); }
          }}
          onOpenQuote={async () => { const q = await getOrCreateQuote(screen.item); if (q) setScreen({ name: "quote", quoteId: q.id, item: screen.item, back: screen.back }); }}
          onUndoDevis={async (id) => { const u = await setInterventionStatus(id, "attente"); if (u) setScreen({ name: "detail", item: u, back: screen.back }); }}
          onReopen={async (id) => { const u = await setInterventionStatus(id, "attente"); if (u) setScreen({ name: "detail", item: u, back: screen.back }); }}
          onClose={() => setScreen({ name: "closure", item: screen.item, back: screen.back })}
        />
      )}

      {screen.name === "quote" && (
        <QuoteScreen
          quote={quotes.find((q) => q.id === screen.quoteId)}
          item={screen.item}
          client={clients.find((c) => c.id === screen.item.clientId) || clients.find((c) => c.name === screen.item.client)}
          articles={articles}
          onUpdateItems={(items) => updateQuote(screen.quoteId, { items })}
          onSetStatus={(status) => updateQuote(screen.quoteId, { status })}
          onBack={() => setScreen({ name: "detail", item: screen.item, back: screen.back })}
        />
      )}

      {screen.name === "closure" && (
        <ClosureScreen
          item={screen.item}
          onCancel={() => setScreen({ name: "detail", item: screen.item, back: screen.back })}
          onSave={async (reportText) => {
            await setInterventionStatus(screen.item.id, "cloture", reportText);
            setScreen(screen.back || { name: "list" });
          }}
        />
      )}

      {screen.name === "form" && (
        <FormScreen
          initial={screen.item}
          defaultDate={day}
          clients={clients}
          equipment={equipment}
          addClient={addClient}
          deleteClient={deleteClient}
          addSite={addSite}
          deleteSite={deleteSite}
          addEquipment={addEquipment}
          deleteEquipment={deleteEquipment}
          onCancel={() => setScreen(screen.back || { name: "list" })}
          onSave={async (item) => { await saveIntervention(item); setScreen(screen.back || { name: "list" }); }}
          onDelete={async (id) => { if (window.confirm("Supprimer définitivement cette intervention ?")) { await deleteIntervention(id); setScreen(screen.back || { name: "list" }); } }}
        />
      )}

      {screen.name === "backup" && (
        <BackupScreen
          clients={clients} equipment={equipment} interventions={interventions}
          onBack={() => setScreen({ name: "list" })}
        />
      )}
    </div>
  );
}

// ------------------------------------------------------------------ SWIPE ROW
function SwipeRow({ onDelete, children, onClick }) {
  const [tx, setTx] = useState(0);
  const drag = useRef(null);
  const openRef = useRef(false);

  function start(x, y) { drag.current = { x, y, tx0: tx, horiz: null }; }
  function move(x, y) {
    const d = drag.current;
    if (!d) return false;
    const dx = x - d.x, dy = y - d.y;
    if (d.horiz === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) d.horiz = Math.abs(dx) > Math.abs(dy);
    if (d.horiz) {
      let next = d.tx0 + dx;
      next = Math.max(-84, Math.min(0, next));
      setTx(next);
      return true;
    }
    return false;
  }
  function end() {
    const d = drag.current;
    if (d && d.horiz) {
      const willOpen = tx < -40;
      setTx(willOpen ? -84 : 0);
      openRef.current = willOpen;
    }
    drag.current = null;
  }
  function handleClick() {
    if (openRef.current) { setTx(0); openRef.current = false; return; }
    onClick && onClick();
  }

  return (
    <div className="relative overflow-hidden border-b border-slate-200">
      {onDelete && (
        <div className="absolute inset-y-0 right-0 w-[84px] flex items-center justify-center" style={{ background: RED }} onClick={() => { onDelete(); setTx(0); openRef.current = false; }}>
          <span className="text-white text-lg">🗑</span>
        </div>
      )}
      <div
        className="bg-white"
        style={{ transform: `translateX(${tx}px)`, transition: drag.current ? "none" : "transform 0.18s", touchAction: "pan-y" }}
        onTouchStart={(e) => start(e.touches[0].clientX, e.touches[0].clientY)}
        onTouchMove={(e) => { if (move(e.touches[0].clientX, e.touches[0].clientY) && e.cancelable) e.preventDefault(); }}
        onTouchEnd={end}
        onMouseDown={(e) => start(e.clientX, e.clientY)}
        onMouseMove={(e) => { if (e.buttons === 1) move(e.clientX, e.clientY); }}
        onMouseUp={end}
        onMouseLeave={() => drag.current && end()}
        onClick={handleClick}
      >
        {children}
      </div>
    </div>
  );
}

// ------------------------------------------------------------------ FORM (créer / modifier)
function FormScreen({ initial, defaultDate, clients, equipment, addClient, deleteClient, addSite, deleteSite, addEquipment, deleteEquipment, onCancel, onSave, onDelete }) {
  const [form, setForm] = useState(initial || {
    id: String(Date.now()), clientId: "", client: "", site: "", equipmentId: "", equipment: "", type: "", description: "", flags: [], date: defaultDate, time: nowTime(), status: "attente", report: "", technician: "Moi",
  });
  const [picker, setPicker] = useState(null);

  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  const valid = form.client && form.type;
  const currentClient = clients.find((c) => c.id === form.clientId) || clients.find((c) => c.name === form.client);
  const clientEquipment = currentClient ? equipment.filter((e) => e.clientId === currentClient.id) : [];

  if (picker === "client") {
    return (
      <ClientPicker
        clients={clients}
        value={form.client}
        onSelect={(c) => { set("clientId", c.id); set("client", c.name); set("site", ""); set("equipmentId", ""); set("equipment", ""); setPicker(null); }}
        onDelete={deleteClient}
        onAdd={() => setPicker("client-add")}
        onBack={() => setPicker(null)}
      />
    );
  }
  if (picker === "client-add") {
    return (
      <AddScreen
        title="Nouveau client"
        fields={CLIENT_FIELDS}
        onCancel={() => setPicker("client")}
        onSave={async (vals) => {
          if (!vals.name.trim()) return;
          const c = await addClient(vals);
          if (c) { set("clientId", c.id); set("client", c.name); set("site", ""); set("equipmentId", ""); set("equipment", ""); }
          setPicker(null);
        }}
      />
    );
  }
  if (picker === "site") {
    const sites = currentClient ? currentClient.sites : [];
    return (
      <ListPicker
        title="Site"
        options={sites}
        value={form.site}
        onSelect={(v) => { set("site", v); setPicker(null); }}
        onDelete={(v) => currentClient && deleteSite(currentClient.id, v)}
        onAdd={currentClient ? () => setPicker("site-add") : null}
        emptyMessage={currentClient ? "Aucun site. Touchez + pour en ajouter un." : "Choisissez d'abord un client."}
        onBack={() => setPicker(null)}
      />
    );
  }
  if (picker === "site-add") {
    return (
      <AddScreen
        title="Nouveau site"
        fields={[{ key: "name", label: "Nom du site", placeholder: "Ex : Paris 15e" }]}
        onCancel={() => setPicker("site")}
        onSave={(vals) => {
          if (!vals.name.trim() || !currentClient) return;
          addSite(currentClient.id, vals.name.trim());
          set("site", vals.name.trim());
          setPicker(null);
        }}
      />
    );
  }
  if (picker === "equipment") {
    return (
      <ListPicker
        title="Equipement"
        options={clientEquipment.map((e) => `${e.code ? e.code + " — " : ""}${e.label}${e.model ? " (" + e.model + ")" : ""}`)}
        value={form.equipment}
        onSelect={(v) => {
          const idx = clientEquipment.findIndex((e) => `${e.code ? e.code + " — " : ""}${e.label}${e.model ? " (" + e.model + ")" : ""}` === v);
          const eq = clientEquipment[idx];
          set("equipment", v); set("equipmentId", eq ? eq.id : "");
          setPicker(null);
        }}
        onDelete={(v) => {
          const idx = clientEquipment.findIndex((e) => `${e.code ? e.code + " — " : ""}${e.label}${e.model ? " (" + e.model + ")" : ""}` === v);
          const eq = clientEquipment[idx];
          if (eq) deleteEquipment(eq.id);
        }}
        onAdd={currentClient ? () => setPicker("equipment-add") : null}
        emptyMessage={currentClient ? "Aucun matériel référencé. Touchez + pour en ajouter un." : "Choisissez d'abord un client."}
        onBack={() => setPicker(null)}
      />
    );
  }
  if (picker === "equipment-add") {
    return (
      <AddScreen
        title="Nouveau matériel"
        fields={[
          { key: "code", label: "Code / Référence", placeholder: "Ex : 25732" },
          { key: "label", label: "Désignation", placeholder: "Ex : Four Rational" },
          { key: "model", label: "Modèle", placeholder: "Ex : SCC101" },
          { key: "serial", label: "Numéro de série", placeholder: "Ex : RTL2026003912" },
        ]}
        onCancel={() => setPicker("equipment")}
        onSave={async (vals) => {
          if (!vals.code.trim() || !vals.label.trim() || !vals.model.trim() || !vals.serial.trim() || !currentClient) return;
          const eq = await addEquipment(currentClient.id, vals.code.trim(), vals.label.trim(), vals.model.trim(), vals.serial.trim());
          if (eq) {
            set("equipment", `${eq.code} — ${eq.label} (${eq.model})`);
            set("equipmentId", eq.id);
          }
          setPicker(null);
        }}
      />
    );
  }
  if (picker === "type") {
    return <ListPicker title="Type Int." options={INT_TYPES} value={form.type} onSelect={(v) => { set("type", v); setPicker(null); }} onBack={() => setPicker(null)} />;
  }
  if (picker === "flags") {
    return (
      <ListPicker
        title="Drapeaux" options={FLAGS} multi value={form.flags}
        onToggle={(v) => set("flags", form.flags.includes(v) ? form.flags.filter((f) => f !== v) : [...form.flags, v])}
        onBack={() => setPicker(null)}
      />
    );
  }
  if (picker === "description") {
    return (
      <div className="flex flex-col h-full">
        <ScreenHeader title="Description" />
        <div className="flex items-center justify-end px-3 py-2 shrink-0" style={{ background: TOOLBAR_GREY }}>
          <button onClick={() => setPicker(null)} className="text-white font-semibold text-[15px]">OK</button>
        </div>
        <textarea autoFocus value={form.description} onChange={(e) => set("description", e.target.value)} className="flex-1 p-3 text-[15px] outline-none resize-none" placeholder="Description de l'intervention…" />
      </div>
    );
  }

  return (
    <>
      <ScreenHeader title={initial ? "Modifier l'intervention" : "Nouvelle intervention"} />
      <div className="flex items-center gap-3 px-3 py-2 shrink-0" style={{ background: TOOLBAR_GREY }}>
        <button onClick={onCancel} className="flex-1 text-white font-semibold text-[15px] rounded-md py-2" style={{ background: "#555f66" }}>Annuler</button>
        <button onClick={() => valid && onSave(form)} disabled={!valid} className="flex-1 text-white font-semibold text-[15px] rounded-md py-2 disabled:opacity-50" style={{ background: GREEN }}>Valider</button>
      </div>
      <div className="flex-1 overflow-y-auto bg-slate-100">
        <div className="bg-white mt-2">
          <Row required label="Client" value={form.client} onClick={() => setPicker("client")} />
          <Row label="Site" value={form.site} onClick={() => setPicker("site")} />
          <Row label="Equipement" value={form.equipment} onClick={() => setPicker("equipment")} />
          <Row required label="Type Int." value={form.type} onClick={() => setPicker("type")} />
          <Row label="Description" value={form.description} onClick={() => setPicker("description")} last />
        </div>
        <div className="bg-white mt-4"><Row label="Drapeaux" value={form.flags.join(", ")} onClick={() => setPicker("flags")} last /></div>
        <div className="bg-white mt-4">
          <div className="flex items-center justify-between px-3 py-3 border-b border-slate-200">
            <span className="text-[15px] text-slate-800">Date</span>
            <input type="date" value={form.date} onChange={(e) => set("date", e.target.value)} className="text-[15px] text-right outline-none" />
          </div>
          <div className="flex items-center justify-between px-3 py-3">
            <span className="text-[15px] text-slate-800">Heure</span>
            <input type="time" value={form.time} onChange={(e) => set("time", e.target.value)} className="text-[15px] text-right outline-none" />
          </div>
        </div>
        {initial && (
          <button onClick={() => onDelete(form.id)} className="w-full flex items-center justify-center gap-2 text-red-600 font-medium text-[15px] py-3 mt-4 mb-6 bg-white">
            🗑 Supprimer l'intervention
          </button>
        )}
      </div>
    </>
  );
}

function Row({ label, value, onClick, required, last }) {
  return (
    <button onClick={onClick} className={`w-full flex items-center justify-between px-3 py-3 active:bg-slate-50 ${last ? "" : "border-b border-slate-200"}`}>

// ------------------------------------------------------------------ DEVIS
function buildQuotePdf(quote, item, client) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const items = quote.items || [];
  let y = 20;

  try {
    doc.addImage(LOGO_DATA_URI, "PNG", 14, 10, 28, 28);
  } catch (e) { console.warn("logo embed failed", e); }
  doc.setFontSize(10); doc.setFont(undefined, "normal"); doc.setTextColor(100);
  doc.text("Devis", 48, 20);
  doc.setTextColor(0);
  y = 46;

  doc.setFontSize(11); doc.setFont(undefined, "bold");
  doc.text(client ? client.name : (item.client || ""), 14, y); y += 5;
  doc.setFont(undefined, "normal"); doc.setFontSize(10);
  if (client && client.address) { doc.text([client.address, [client.postalCode, client.city].filter(Boolean).join(" ")].filter(Boolean).join(", "), 14, y); y += 5; }
  if (client && client.phone) { doc.text(client.phone, 14, y); y += 5; }
  y += 4;
  doc.text(`Date : ${frDate(item.date)}`, 14, y); y += 5;
  if (item.equipment) { doc.text(`Matériel : ${item.equipment}`, 14, y); y += 5; }
  y += 6;

  doc.setFont(undefined, "bold");
  doc.text("Désignation", 14, y);
  doc.text("Qté", 118, y);
  doc.text("PU", 138, y);
  doc.text("TVA", 160, y);
  doc.text("Total", 180, y);
  doc.setFont(undefined, "normal");
  y += 2;
  doc.line(14, y, 196, y);
  y += 6;

  let totalHT = 0, totalTVA = 0;
  items.forEach((it) => {
    const lineHT = it.quantity * it.unitPrice;
    const tva = it.tvaRate == null ? 20 : it.tvaRate;
    const lineTVA = lineHT * (tva / 100);
    totalHT += lineHT; totalTVA += lineTVA;
    const desLines = doc.splitTextToSize(it.designation, 100);
    doc.text(desLines, 14, y);
    doc.text(String(it.quantity), 118, y);
    doc.text(money(it.unitPrice), 138, y);
    doc.text(`${tva}%`, 160, y);
    doc.text(money(lineHT), 180, y);
    y += Math.max(6, desLines.length * 5);
    if (y > 270) { doc.addPage(); y = 20; }
  });

  y += 4;
  doc.line(120, y, 196, y);
  y += 7;
  doc.text("Total HT", 138, y); doc.text(money(totalHT), 180, y); y += 6;
  doc.text("Total TVA", 138, y); doc.text(money(totalTVA), 180, y); y += 6;
  doc.setFont(undefined, "bold");
  doc.text("Total TTC", 138, y); doc.text(money(totalHT + totalTVA), 180, y);

  return doc;
}

function QuoteScreen({ quote, item, client, articles, onUpdateItems, onSetStatus, onBack }) {
  const [search, setSearch] = useState("");
  const [qtyFor, setQtyFor] = useState(null);
  const [qty, setQty] = useState("1");
  const [tva, setTva] = useState("20");
  const [freeLine, setFreeLine] = useState(null); // { designation, unitPrice, quantity, tvaRate }

  if (!quote) return <div className="p-6 text-slate-400">Chargement du devis…</div>;
  const items = quote.items || [];
  const locked = quote.status === "valide";

  const filtered = articles.filter((a) => {
    if (!search.trim()) return false;
    const s = search.toLowerCase();
    return a.label.toLowerCase().includes(s) || a.reference.toLowerCase().includes(s);
  }).slice(0, 20);

  function addLine(article, quantity, tvaRate) {
    const q = Math.max(1, parseInt(quantity, 10) || 1);
    const rate = tvaRate === "" || tvaRate == null ? 20 : parseFloat(tvaRate);
    const next = [...items, {
      articleId: article.id, designation: article.label, reference: article.reference,
      quantity: q, unitPrice: article.salePrice, purchasePrice: article.purchasePrice, tvaRate: rate,
    }];
    onUpdateItems(next);
    setQtyFor(null); setQty("1"); setTva("20"); setSearch("");
  }
  function addFreeLine(vals) {
    const q = Math.max(1, parseFloat(vals.quantity) || 1);
    const price = parseFloat(vals.unitPrice) || 0;
    const rate = vals.tvaRate === "" || vals.tvaRate == null ? 0 : parseFloat(vals.tvaRate);
    const next = [...items, {
      articleId: null, designation: vals.designation.trim() || "Ligne", reference: "",
      quantity: q, unitPrice: price, purchasePrice: 0, tvaRate: rate,
    }];
    onUpdateItems(next);
    setFreeLine(null);
  }
  function removeLine(idx) { onUpdateItems(items.filter((_, i) => i !== idx)); }
  function changeQty(idx, delta) {
    onUpdateItems(items.map((it, i) => (i === idx ? { ...it, quantity: Math.max(1, it.quantity + delta) } : it)));
  }

  const totalHT = items.reduce((s, it) => s + it.quantity * it.unitPrice, 0);
  const totalTVA = items.reduce((s, it) => s + it.quantity * it.unitPrice * ((it.tvaRate == null ? 20 : it.tvaRate) / 100), 0);
  const totalTTC = totalHT + totalTVA;
  const totalPurchase = items.reduce((s, it) => s + it.quantity * (it.purchasePrice || 0), 0);
  const margin = totalHT - totalPurchase;
  const marginPct = totalHT > 0 ? (margin / totalHT) * 100 : 0;

  function downloadPdf() {
    const doc = buildQuotePdf(quote, item, client);
    doc.save(`devis-${(client ? client.name : item.client || "client").replace(/[^a-z0-9]+/gi, "-")}.pdf`);
  }
  function sendByEmail() {
    downloadPdf();
    const to = (client && client.email) || "";
    const subject = encodeURIComponent(`Devis C.H.R 26 — ${client ? client.name : item.client}`);
    const body = encodeURIComponent(
      `Bonjour,\n\nVeuillez trouver ci-joint notre devis.\n\nLe PDF vient d'être téléchargé sur votre téléphone — pensez à le joindre à cet email (bouton trombone / pièce jointe) avant l'envoi.\n\nCordialement,\nC.H.R 26`
    );
    window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
  }

  return (
    <div className="flex flex-col h-full">
      <ScreenHeader title="Devis" onBack={onBack} />
      <div className="flex-1 overflow-y-auto bg-slate-100">
        <div className="bg-white p-3">
          <div className="text-[14px] font-medium text-slate-800">{item.client}</div>
          {item.equipment && <div className="text-[13px] text-slate-500">{item.equipment}</div>}
          <div className="mt-1">
            {quote.status === "valide"
              ? <span className="text-[11px] px-1.5 py-0.5 rounded-full text-white" style={{ background: GREEN }}>Validé</span>
              : <span className="text-[11px] px-1.5 py-0.5 rounded-full text-white" style={{ background: AMBER }}>Brouillon</span>}
          </div>
        </div>

        {!locked && (
          <div className="p-3 bg-white border-t border-slate-100 space-y-2">
            <input
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Rechercher une pièce à ajouter…"
              className="w-full bg-slate-100 rounded-md px-3 py-2 text-[14px] outline-none"
            />
            {search.trim() && (
              <div className="border border-slate-200 rounded-md overflow-hidden">
                {filtered.length === 0 && <div className="px-3 py-2 text-[13px] text-slate-400">Aucun résultat.</div>}
                {filtered.map((a) => (
                  <div key={a.id} className="flex items-center justify-between px-3 py-2 border-b border-slate-100 last:border-b-0">
                    <div className="min-w-0">
                      <div className="text-[14px] text-slate-800 truncate">{a.label}</div>
                      <div className="text-[12px] text-slate-400">{a.reference} · {money(a.salePrice)} · TVA {a.tvaRate}%</div>
                    </div>
                    <button onClick={() => { setQtyFor(a); setQty("1"); setTva(String(a.tvaRate)); }} className="w-8 h-8 rounded-full text-white text-xl leading-none shrink-0" style={{ background: GREEN }}>+</button>
                  </div>
                ))}
              </div>
            )}
            <button onClick={() => setFreeLine({ designation: "", unitPrice: "", quantity: "1", tvaRate: "0" })} className="w-full py-2 rounded-md border border-dashed border-slate-300 text-slate-600 text-[13px]">
              + Ligne libre (main d'œuvre, déplacement…)
            </button>
          </div>
        )}

        <div className="px-3 pt-4 pb-1 text-[11px] uppercase tracking-wider text-slate-500 font-medium">Lignes du devis</div>
        <div className="bg-white">
          {items.length === 0 && <div className="px-3 py-3 text-[13px] text-slate-400">Aucune ligne ajoutée pour l'instant.</div>}
          {items.map((it, idx) => (
            <div key={idx} className="px-3 py-3 border-b border-slate-200">
              <div className="flex items-center justify-between gap-2">
                <span className="text-[14px] text-slate-800 flex-1 min-w-0 truncate">{it.designation}</span>
                <span className="text-[14px] font-medium text-slate-800 shrink-0">{money(it.quantity * it.unitPrice)}</span>
              </div>
              <div className="flex items-center justify-between mt-1">
                <span className="text-[12px] text-slate-400">{money(it.unitPrice)} / unité · TVA {it.tvaRate == null ? 20 : it.tvaRate}%</span>
                {!locked ? (
                  <div className="flex items-center gap-2">
                    <button onClick={() => changeQty(idx, -1)} className="w-7 h-7 rounded-full border border-slate-300 text-slate-600">−</button>
                    <span className="text-[14px] w-6 text-center" style={{ fontFamily: "JetBrains Mono, monospace" }}>{it.quantity}</span>
                    <button onClick={() => changeQty(idx, 1)} className="w-7 h-7 rounded-full border border-slate-300 text-slate-600">+</button>
                    <button onClick={() => removeLine(idx)} className="ml-2 text-red-500 text-[13px]">Supprimer</button>
                  </div>
                ) : (
                  <span className="text-[13px] text-slate-500">x{it.quantity}</span>
                )}
              </div>
            </div>
          ))}
        </div>

        <div className="bg-white mt-4 p-3 space-y-1">
          <div className="flex items-center justify-between text-[14px] text-slate-600"><span>Total HT</span><span>{money(totalHT)}</span></div>
          <div className="flex items-center justify-between text-[14px] text-slate-600"><span>Total TVA</span><span>{money(totalTVA)}</span></div>
          <div className="flex items-center justify-between text-[16px] font-semibold text-slate-800 pt-1 border-t border-slate-100"><span>Total TTC</span><span>{money(totalTTC)}</span></div>
        </div>

        <div className="bg-slate-200 mt-4 p-3">
          <div className="text-[11px] uppercase tracking-wider text-slate-500 font-medium mb-1">Vue interne — jamais visible client</div>
          <div className="text-[13px] text-slate-600 flex justify-between"><span>Coût d'achat total</span><span>{money(totalPurchase)}</span></div>
          <div className="text-[13px] text-slate-600 flex justify-between"><span>Montant vendu (HT)</span><span>{money(totalHT)}</span></div>
          <div className="text-[13px] font-medium text-slate-800 flex justify-between mt-1"><span>Marge réalisée</span><span>{money(margin)} ({marginPct.toFixed(0)}%)</span></div>
        </div>

        <div className="p-3 space-y-2 mt-2 mb-6">
          <button onClick={downloadPdf} className="w-full py-2.5 rounded-md border border-slate-300 text-slate-700 font-medium text-[15px] bg-white">📄 Télécharger le devis en PDF</button>
          <button onClick={sendByEmail} className="w-full py-2.5 rounded-md border border-slate-300 text-slate-700 font-medium text-[15px] bg-white">✉️ Envoyer par email</button>
          {!locked ? (
            <button onClick={() => onSetStatus("valide")} className="w-full py-2.5 rounded-md text-white font-medium text-[15px]" style={{ background: GREEN }}>Valider le devis</button>
          ) : (
            <button onClick={() => onSetStatus("brouillon")} className="w-full py-2.5 rounded-md border border-slate-300 text-slate-700 font-medium text-[15px] bg-white">Déverrouiller pour modifier</button>
          )}
        </div>
      </div>

      {qtyFor && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-4" onClick={() => setQtyFor(null)}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-xl w-full max-w-xs p-4">
            <div className="text-[15px] font-semibold text-slate-800 mb-1">{qtyFor.label}</div>
            <div className="text-[12px] text-slate-500 mb-2">Quantité</div>
            <input
              autoFocus type="number" min="1" value={qty}
              onChange={(e) => setQty(e.target.value)}
              className="w-full border border-slate-300 rounded-md px-3 py-2 text-[16px] text-center outline-none mb-3"
            />
            <div className="text-[12px] text-slate-500 mb-2">TVA (%)</div>
            <input
              type="number" min="0" step="0.5" value={tva}
              onChange={(e) => setTva(e.target.value)}
              className="w-full border border-slate-300 rounded-md px-3 py-2 text-[16px] text-center outline-none mb-3"
            />
            <div className="flex gap-2">
              <button onClick={() => setQtyFor(null)} className="flex-1 py-2 rounded-md border border-slate-300 text-slate-700 text-[14px]">Annuler</button>
              <button onClick={() => addLine(qtyFor, qty, tva)} className="flex-1 py-2 rounded-md text-white text-[14px]" style={{ background: GREEN }}>Valider</button>
            </div>
          </div>
        </div>
      )}

      {freeLine && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-4" onClick={() => setFreeLine(null)}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-xl w-full max-w-xs p-4 space-y-2">
            <div className="text-[15px] font-semibold text-slate-800">Ligne libre</div>
            <div>
              <div className="text-[12px] text-slate-500 mb-1">Désignation</div>
              <input autoFocus value={freeLine.designation} onChange={(e) => setFreeLine({ ...freeLine, designation: e.target.value })} placeholder="Ex : Main d'œuvre" className="w-full border border-slate-300 rounded-md px-3 py-2 text-[15px] outline-none" />
            </div>
            <div>
              <div className="text-[12px] text-slate-500 mb-1">Prix unitaire (€)</div>
              <input type="number" step="0.01" value={freeLine.unitPrice} onChange={(e) => setFreeLine({ ...freeLine, unitPrice: e.target.value })} placeholder="Ex : 60" className="w-full border border-slate-300 rounded-md px-3 py-2 text-[15px] outline-none" />
            </div>
            <div className="flex gap-2">
              <div className="flex-1">
                <div className="text-[12px] text-slate-500 mb-1">Quantité</div>
                <input type="number" min="1" value={freeLine.quantity} onChange={(e) => setFreeLine({ ...freeLine, quantity: e.target.value })} className="w-full border border-slate-300 rounded-md px-3 py-2 text-[15px] outline-none" />
              </div>
              <div className="flex-1">
                <div className="text-[12px] text-slate-500 mb-1">TVA (%)</div>
                <input type="number" min="0" step="0.5" value={freeLine.tvaRate} onChange={(e) => setFreeLine({ ...freeLine, tvaRate: e.target.value })} className="w-full border border-slate-300 rounded-md px-3 py-2 text-[15px] outline-none" />
              </div>
            </div>
            <div className="flex gap-2 pt-2">
              <button onClick={() => setFreeLine(null)} className="flex-1 py-2 rounded-md border border-slate-300 text-slate-700 text-[14px]">Annuler</button>
              <button onClick={() => addFreeLine(freeLine)} className="flex-1 py-2 rounded-md text-white text-[14px]" style={{ background: GREEN }}>Ajouter</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
