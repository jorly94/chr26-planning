<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>C.H.R 26 — Planning</title>
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
html, body, #root { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
* { -webkit-tap-highlight-color: transparent; }
</style>
<script>
window.onerror = function(msg, url, line, col, error) {
  var root = document.getElementById('root');
  if (root) {
    root.innerHTML = '<pre style="white-space:pre-wrap;padding:16px;color:#b91c1c;font-size:13px;font-family:monospace;background:#fef2f2;">ERREUR JS:\n' +
      msg + '\n(ligne ' + line + ', colonne ' + col + ')' +
      (error && error.stack ? '\n\n' + error.stack : '') + '</pre>';
  }
  return false;
};
</script>
</head>
<body>
<div id="root">Chargement du script…</div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ---- Supabase connection ----
const SUPABASE_URL = "https://fpefidfhxsiuidlhwxdq.supabase.co";
const SUPABASE_KEY = "sb_publishable_6m7p1_TFrVL1rdjzdJuEXQ_ylo3XyQF";
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---- palette ----
const HEADER_DARK = "#3a4650";
const TOOLBAR_GREY = "#83898d";
const GREEN = "#7cc242";
const BLUE = "#1783e0";
const RED = "#d9433a";
const AMBER = "#e0a020";

const TYPE_COLORS = {
  Depannage: "#e0742a",
  Maintenance: "#1783e0",
  Installation: "#3fa66b",
  Urgence: "#d9433a",
  Atelier: "#6b7280",
};

const STATUS_INFO = {
  attente: { label: "En attente", color: "#94a3b8" },
  devis: { label: "Devis à suivre", color: AMBER },
  cloture: { label: "Clôturé", color: GREEN },
};

function pad(n) { return String(n).padStart(2, "0"); }
function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function frDate(iso) { const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; }
function addDays(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoDate(d); }
function nowTime() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

const INT_TYPES = ["Atelier", "Depannage", "Maintenance", "Installation", "Urgence"];
const FLAGS = ["Prioritaire", "Garantie", "Astreinte", "Sous contrat", "Retour SAV"];

function dbClientToApp(c) {
  return {
    id: c.id, name: c.name, address: c.address || "", phone: c.phone || "", email: c.email || "",
    sites: c.sites || [], contactName: c.contact_name || "", postalCode: c.postal_code || "",
    city: c.city || "", siret: c.siret || "", notes: c.notes || "",
  };
}

const CLIENT_FIELDS = [
  { key: "name", label: "Nom de l'établissement", placeholder: "Ex : Brasserie du Port" },
  { key: "contactName", label: "Nom du contact", placeholder: "Ex : M. Dupont" },
  { key: "phone", label: "Téléphone", placeholder: "Ex : 01 39 12 44 55" },
  { key: "email", label: "Email", placeholder: "Ex : contact@client.fr" },
  { key: "address", label: "Adresse complète", placeholder: "Ex : 2 quai de Seine" },
  { key: "postalCode", label: "Code postal", placeholder: "Ex : 95100" },
  { key: "city", label: "Ville", placeholder: "Ex : Argenteuil" },
  { key: "siret", label: "SIRET (optionnel)", placeholder: "" },
  { key: "notes", label: "Informations complémentaires", placeholder: "" },
];
function dbEquipmentToApp(e) {
  return { id: e.id, clientId: e.client_id, code: e.code || "", label: e.label || "", model: e.model || "", serial: e.serial || "" };
}
function dbInterventionToApp(it) {
  return {
    id: it.id, clientId: it.client_id || null, client: it.client || "", site: it.site || "",
    equipmentId: it.equipment_id || null, equipment: it.equipment || "",
    type: it.type || "", description: it.description || "", flags: it.flags || [],
    date: it.date, time: it.time || "", status: it.status || "attente",
    report: it.report || "", technician: it.technician || "Moi",
  };
}

function loadFonts() {}

async function loadAll() {
  const [c, e, i] = await Promise.all([
    sbClient.from("clients").select("*").order("created_at", { ascending: true }),
    sbClient.from("equipment").select("*").order("created_at", { ascending: true }),
    sbClient.from("interventions").select("*").order("created_at", { ascending: true }),
  ]);
  if (c.error) throw c.error;
  if (e.error) throw e.error;
  if (i.error) throw i.error;
  return {
    clients: (c.data || []).map(dbClientToApp),
    equipment: (e.data || []).map(dbEquipmentToApp),
    interventions: (i.data || []).map(dbInterventionToApp),
  };
}

function App() {
  const [clients, setClients] = useState(null);
  const [equipment, setEquipment] = useState(null);
  const [interventions, setInterventions] = useState(null);
  const [day, setDay] = useState(isoDate(new Date()));
  const [screen, setScreen] = useState({ name: "list" });
  const [saveError, setSaveError] = useState(null);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const data = await loadAll();
        setClients(data.clients);
        setEquipment(data.equipment);
        setInterventions(data.interventions);
      } catch (e) {
        setSaveError("Impossible de charger les données : " + (e.message || String(e)));
        setClients([]); setEquipment([]); setInterventions([]);
      }
    })();
  }, []);

  function flash() { setSaveError(null); setSaved(true); setTimeout(() => setSaved(false), 1200); }
  function fail(e) { console.error(e); setSaveError((e && e.message) || "Échec de l'enregistrement"); }

  if (clients === null || equipment === null || interventions === null) {
    return <div className="h-screen flex items-center justify-center bg-white text-slate-400">Chargement…</div>;
  }

  const dayItems = interventions.filter((it) => it.date === day).slice().sort((a, b) => (a.time || "").localeCompare(b.time || ""));

  // ---- clients ----
  async function addClient(vals) {
    try {
      const { data, error } = await sbClient.from("clients").insert({
        name: vals.name.trim(),
        address: (vals.address || "").trim(),
        phone: (vals.phone || "").trim(),
        email: (vals.email || "").trim(),
        contact_name: (vals.contactName || "").trim(),
        postal_code: (vals.postalCode || "").trim(),
        city: (vals.city || "").trim(),
        siret: (vals.siret || "").trim(),
        notes: (vals.notes || "").trim(),
        sites: [],
      }).select();
      if (error) throw error;
      const created = dbClientToApp(data[0]);
      setClients((prev) => [...prev, created]);
      flash();
      return created;
    } catch (e) { fail(e); return null; }
  }
  async function deleteClient(id) {
    try {
      const { error } = await sbClient.from("clients").delete().eq("id", id);
      if (error) throw error;
      setClients((prev) => prev.filter((c) => c.id !== id));
      flash();
    } catch (e) { fail(e); }
  }
  async function patchClient(clientId, patch) {
    try {
      const { data, error } = await sbClient.from("clients").update(patch).eq("id", clientId).select();
      if (error) throw error;
      const updated = dbClientToApp(data[0]);
      setClients((prev) => prev.map((c) => (c.id === clientId ? updated : c)));
      flash();
    } catch (e) { fail(e); }
  }
  function addSite(clientId, siteName) {
    const c = clients.find((c) => c.id === clientId);
    if (!c) return;
    patchClient(clientId, { sites: [...c.sites, siteName] });
  }
  function deleteSite(clientId, siteName) {
    const c = clients.find((c) => c.id === clientId);
    if (!c) return;
    patchClient(clientId, { sites: c.sites.filter((s) => s !== siteName) });
  }

  // ---- equipment ----
  async function addEquipment(clientId, code, label, model, serial) {
    try {
      const { data, error } = await sbClient.from("equipment").insert({ client_id: clientId, code, label, model, serial }).select();
      if (error) throw error;
      const created = dbEquipmentToApp(data[0]);
      setEquipment((prev) => [...prev, created]);
      flash();
      return created;
    } catch (e) { fail(e); return null; }
  }
  async function deleteEquipment(equipId) {
    try {
      const { error } = await sbClient.from("equipment").delete().eq("id", equipId);
      if (error) throw error;
      setEquipment((prev) => prev.filter((e) => e.id !== equipId));
      flash();
    } catch (e) { fail(e); }
  }

  // ---- interventions ----
  async function saveIntervention(item) {
    try {
      const body = {
        client: item.client, client_id: item.clientId || null, site: item.site,
        equipment: item.equipment, equipment_id: item.equipmentId || null,
        type: item.type, description: item.description, flags: item.flags,
        date: item.date, time: item.time, status: item.status || "attente",
        report: item.report || "", technician: item.technician || "Moi",
      };
      const isExisting = interventions.some((p) => p.id === item.id);
      if (isExisting) {
        const { data, error } = await sbClient.from("interventions").update(body).eq("id", item.id).select();
        if (error) throw error;
        const updated = dbInterventionToApp(data[0]);
        setInterventions((prev) => prev.map((p) => (p.id === updated.id ? updated : p)));
        flash();
        return updated;
      } else {
        const { data, error } = await sbClient.from("interventions").insert(body).select();
        if (error) throw error;
        const created = dbInterventionToApp(data[0]);
        setInterventions((prev) => [...prev, created]);
        flash();
        return created;
      }
    } catch (e) { fail(e); return null; }
  }
  async function deleteIntervention(id) {
    try {
      const { error } = await sbClient.from("interventions").delete().eq("id", id);
      if (error) throw error;
      setInterventions((prev) => prev.filter((p) => p.id !== id));
      flash();
    } catch (e) { fail(e); }
  }
  async function setInterventionStatus(id, status, report) {
    try {
      const patch = { status };
      if (typeof report === "string") patch.report = report;
      const { data, error } = await sbClient.from("interventions").update(patch).eq("id", id).select();
      if (error) throw error;
      const updated = dbInterventionToApp(data[0]);
      setInterventions((prev) => prev.map((p) => (p.id === updated.id ? updated : p)));
      flash();
      return updated;
    } catch (e) { fail(e); return null; }
  }

  function openDate(iso) { setDay(iso); }

  return (
    <div className="h-screen w-full flex flex-col bg-white overflow-hidden select-none" style={{ fontFamily: "Inter, sans-serif" }}>
      {saveError && (
        <div className="bg-red-600 text-white text-[12px] px-3 py-1.5 shrink-0 flex items-center justify-between gap-2">
          <span className="truncate">⚠ {saveError}</span>
          <button onClick={() => setSaveError(null)} className="shrink-0 font-bold">✕</button>
        </div>
      )}
      {saved && !saveError && (
        <div className="bg-emerald-600 text-white text-[12px] px-3 py-1 shrink-0 text-center">✓ Enregistré</div>
      )}

      {screen.name === "list" && (
        <ListScreen
          day={day} setDay={openDate} items={dayItems}
          onNew={() => setScreen({ name: "form", item: null })}
          onOpen={(item) => setScreen({ name: "detail", item })}
          onNavClients={() => setScreen({ name: "clients" })}
          onNavBackup={() => setScreen({ name: "backup" })}
        />
      )}

      {screen.name === "clients" && (
        <ClientsScreen
          clients={clients}
          onBack={() => setScreen({ name: "list" })}
          onOpenClient={(c) => setScreen({ name: "client-detail", clientId: c.id })}
          onAddNew={() => setScreen({ name: "client-add-standalone" })}
        />
      )}

      {screen.name === "client-add-standalone" && (
        <AddScreen
          title="Nouveau client"
          fields={CLIENT_FIELDS}
          onCancel={() => setScreen({ name: "clients" })}
          onSave={async (vals) => {
            if (!vals.name.trim()) return;
            const c = await addClient(vals);
            if (c) setScreen({ name: "client-detail", clientId: c.id });
            else setScreen({ name: "clients" });
          }}
        />
      )}

      {screen.name === "client-detail" && (
        <ClientDetailScreen
          client={clients.find((c) => c.id === screen.clientId)}
          equipmentList={equipment.filter((e) => e.clientId === screen.clientId)}
          interventionsList={interventions.filter((it) => it.clientId === screen.clientId)}
          onBack={() => setScreen({ name: "clients" })}
          onOpenEquipment={(eq) => setScreen({ name: "equipment-history", equipmentId: eq.id, back: { name: "client-detail", clientId: screen.clientId } })}
          onOpenIntervention={(it) => setScreen({ name: "detail", item: it, back: { name: "client-detail", clientId: screen.clientId } })}
        />
      )}

      {screen.name === "equipment-history" && (
        <EquipmentHistoryScreen
          eq={equipment.find((e) => e.id === screen.equipmentId)}
          interventionsList={interventions.filter((it) => it.equipmentId === screen.equipmentId && it.status === "cloture")}
          onBack={() => setScreen(screen.back || { name: "list" })}
        />
      )}

      {screen.name === "detail" && (
        <InterventionDetailScreen
          item={screen.item}
          client={clients.find((c) => c.id === screen.item.clientId) || clients.find((c) => c.name === screen.item.client)}
          onBack={() => setScreen(screen.back || { name: "list" })}
          onEdit={() => setScreen({ name: "form", item: screen.item, back: screen.back })}
          onDelete={async (id) => { if (window.confirm("Supprimer définitivement cette intervention ?")) { await deleteIntervention(id); setScreen(screen.back || { name: "list" }); } }}
          onDevis={async (id) => { const u = await setInterventionStatus(id, "devis"); if (u) setScreen({ name: "detail", item: u, back: screen.back }); }}
          onUndoDevis={async (id) => { const u = await setInterventionStatus(id, "attente"); if (u) setScreen({ name: "detail", item: u, back: screen.back }); }}
          onReopen={async (id) => { const u = await setInterventionStatus(id, "attente"); if (u) setScreen({ name: "detail", item: u, back: screen.back }); }}
          onClose={() => setScreen({ name: "closure", item: screen.item, back: screen.back })}
        />
      )}

      {screen.name === "closure" && (
        <ClosureScreen
          item={screen.item}
          onCancel={() => setScreen({ name: "detail", item: screen.item, back: screen.back })}
          onSave={async (reportText) => {
            await setInterventionStatus(screen.item.id, "cloture", reportText);
            setScreen(screen.back || { name: "list" });
          }}
        />
      )}

      {screen.name === "form" && (
        <FormScreen
          initial={screen.item}
          defaultDate={day}
          clients={clients}
          equipment={equipment}
          addClient={addClient}
          deleteClient={deleteClient}
          addSite={addSite}
          deleteSite={deleteSite}
          addEquipment={addEquipment}
          deleteEquipment={deleteEquipment}
          onCancel={() => setScreen(screen.back || { name: "list" })}
          onSave={async (item) => { await saveIntervention(item); setScreen(screen.back || { name: "list" }); }}
          onDelete={async (id) => { if (window.confirm("Supprimer définitivement cette intervention ?")) { await deleteIntervention(id); setScreen(screen.back || { name: "list" }); } }}
        />
      )}

      {screen.name === "backup" && (
        <BackupScreen
          clients={clients} equipment={equipment} interventions={interventions}
          onBack={() => setScreen({ name: "list" })}
        />
      )}
    </div>
  );
}

              </div>

              {it.flags && it.flags.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-1">
                  {it.flags.map((f) => <span key={f} className="text-[11px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">{f}</span>)}
                </div>
              )}
            </div>
            <div className="flex items-center pr-3 text-slate-300">›</div>
          </button>
        ))}
      </div>

      <div className="flex items-stretch border-t border-slate-200 bg-white shrink-0" style={{ paddingBottom: "env(safe-area-inset-bottom)" }}>
        <div className="flex-1 flex flex-col items-center gap-0.5 py-2">
          <span style={{ color: BLUE }}>🏠</span>
          <span className="text-[11px] font-medium" style={{ color: BLUE }}>Interventions</span>
        </div>
        <button onClick={onNavClients} className="flex-1 flex flex-col items-center gap-0.5 py-2">
          <span style={{ color: "#333" }}>👥</span>
          <span className="text-[11px] font-medium" style={{ color: "#333" }}>Clients</span>
        </button>
        <button onClick={onNavBackup} className="flex-1 flex flex-col items-center gap-0.5 py-2">
          <span style={{ color: "#333" }}>•••</span>
          <span className="text-[11px] font-medium" style={{ color: "#333" }}>Plus</span>
        </button>
      </div>
    </>
  );
}

// ------------------------------------------------------------------ SWIPE ROW
function SwipeRow({ onDelete, children, onClick }) {
  const [tx, setTx] = useState(0);
  const drag = useRef(null);
  const openRef = useRef(false);

  function start(x, y) { drag.current = { x, y, tx0: tx, horiz: null }; }
  function move(x, y) {
    const d = drag.current;
    if (!d) return false;
    const dx = x - d.x, dy = y - d.y;
    if (d.horiz === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) d.horiz = Math.abs(dx) > Math.abs(dy);
    if (d.horiz) {
      let next = d.tx0 + dx;
      next = Math.max(-84, Math.min(0, next));
      setTx(next);
      return true;
    }
    return false;
  }
  function end() {
    const d = drag.current;
    if (d && d.horiz) {
      const willOpen = tx < -40;
      setTx(willOpen ? -84 : 0);
      openRef.current = willOpen;
    }
    drag.current = null;
  }
  function handleClick() {
    if (openRef.current) { setTx(0); openRef.current = false; return; }
    onClick && onClick();
  }

  return (
    <div className="relative overflow-hidden border-b border-slate-200">
      {onDelete && (
        <div className="absolute inset-y-0 right-0 w-[84px] flex items-center justify-center" style={{ background: RED }} onClick={() => { onDelete(); setTx(0); openRef.current = false; }}>
          <span className="text-white text-lg">🗑</span>
        </div>
      )}
      <div
        className="bg-white"
        style={{ transform: `translateX(${tx}px)`, transition: drag.current ? "none" : "transform 0.18s", touchAction: "pan-y" }}
        onTouchStart={(e) => start(e.touches[0].clientX, e.touches[0].clientY)}
        onTouchMove={(e) => { if (move(e.touches[0].clientX, e.touches[0].clientY) && e.cancelable) e.preventDefault(); }}
        onTouchEnd={end}
        onMouseDown={(e) => start(e.clientX, e.clientY)}
        onMouseMove={(e) => { if (e.buttons === 1) move(e.clientX, e.clientY); }}
        onMouseUp={end}
        onMouseLeave={() => drag.current && end()}
        onClick={handleClick}
      >
        {children}
      </div>
    </div>
  );
}

function ScreenHeader({ title, onBack, backLabel, right }) {
  return (
    <div className="flex items-center gap-2 px-3 py-3 text-white shrink-0 relative" style={{ background: HEADER_DARK }}>
      {onBack && <button onClick={onBack} className="flex items-center gap-1"><span className="text-xl">‹</span><span className="text-[15px]">{backLabel || "Retour"}</span></button>}
      <span className="font-bold text-[17px] flex-1 text-center" style={{ marginRight: onBack ? 56 : 0 }}>{title}</span>
      {right && <div className="absolute right-3 top-1/2 -translate-y-1/2">{right}</div>}
    </div>
  );

          {client.contactName && <div className="text-[13px] text-slate-600">Contact : {client.contactName}</div>}
          {(client.address || client.postalCode || client.city) && (
            <div className="text-[13px] text-slate-600">{[client.address, [client.postalCode, client.city].filter(Boolean).join(" ")].filter(Boolean).join(", ")}</div>

// ------------------------------------------------------------------ DETAIL D'INTERVENTION (actions)
function mapsLink(client) {
  if (!client) return null;
  const parts = [client.address, client.postalCode, client.city].filter(Boolean);
  if (parts.length === 0) return null;
  const q = encodeURIComponent(parts.join(", "));
  return `https://waze.com/ul?q=${q}&navigate=yes`;
}

  const link = mapsLink(client);
  return (
    <div className="flex flex-col h-full">
      <ScreenHeader title="Intervention" onBack={onBack} />
      <div className="flex-1 overflow-y-auto bg-slate-100">
        <div className="bg-white mt-2 p-3 space-y-1.5">
          <div className="flex items-center justify-between">
            <span className="text-[16px] font-semibold text-slate-800">{item.type}</span>
            {statusBadge(item.status)}
          </div>
          <div className="text-[14px] text-slate-700">{item.client}</div>
          {item.site && <div className="text-[14px] text-slate-700">{item.site}</div>}
          {link ? (
            <a href={link} className="text-[13px] block" style={{ color: BLUE }}>
              📍 {[client.address, client.postalCode, client.city].filter(Boolean).join(", ")}

          ) : (
            client && client.address && <div className="text-[13px] text-slate-500">{client.address}</div>
          )}
          {client && client.phone && (
            <a href={`tel:${client.phone.replace(/\s+/g, "")}`} className="text-[13px] block" style={{ color: BLUE }}>☎ {client.phone}</a>

          {item.equipment && <div className="text-[13px] text-slate-500">{item.equipment}</div>}
          {item.description && <div className="text-[13px] text-slate-500">{item.description}</div>}
          <div className="text-[13px] text-slate-500" style={{ fontFamily: "JetBrains Mono, monospace" }}>{frDate(item.date)} {item.time}</div>
          {item.flags && item.flags.length > 0 && (
            <div className="flex flex-wrap gap-1 pt-1">

        <div className="p-3 space-y-2 mt-2">

          {item.status === "attente" && (
            <button onClick={() => onDevis(item.id)} className="w-full py-2.5 rounded-md text-white font-medium text-[15px]" style={{ background: AMBER }}>Devis à suivre</button>
          )}
          {item.status === "devis" && (
            <button onClick={() => onUndoDevis(item.id)} className="w-full py-2.5 rounded-md border font-medium text-[15px] bg-white" style={{ borderColor: AMBER, color: AMBER }}>✕ Retirer "Devis à suivre"</button>
          )}
          {item.status === "cloture" && (
            <button onClick={() => onReopen(item.id)} className="w-full py-2.5 rounded-md border border-slate-300 text-slate-700 font-medium text-[15px] bg-white">Rouvrir l'intervention</button>
          )}

          {item.status !== "cloture" && (

function ClosureScreen({ item, onCancel, onSave }) {

      <div className="flex-1 overflow-y-auto p-3 bg-slate-100">

          autoFocus
          value={text}

// ------------------------------------------------------------------ FORM (créer / modifier)
function FormScreen({ initial, defaultDate, clients, equipment, addClient, deleteClient, addSite, deleteSite, addEquipment, deleteEquipment, onCancel, onSave, onDelete }) {
  const [form, setForm] = useState(initial || {
    id: String(Date.now()), clientId: "", client: "", site: "", equipmentId: "", equipment: "", type: "", description: "", flags: [], date: defaultDate, time: nowTime(), status: "attente", report: "", technician: "Moi",
  });
  const [picker, setPicker] = useState(null);

  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  const valid = form.client && form.type;
  const currentClient = clients.find((c) => c.id === form.clientId) || clients.find((c) => c.name === form.client);
  const clientEquipment = currentClient ? equipment.filter((e) => e.clientId === currentClient.id) : [];

  if (picker === "client") {
    return (
      <ClientPicker
        clients={clients}
        value={form.client}
        onSelect={(c) => { set("clientId", c.id); set("client", c.name); set("site", ""); set("equipmentId", ""); set("equipment", ""); setPicker(null); }}
        onDelete={deleteClient}
        onAdd={() => setPicker("client-add")}
        onBack={() => setPicker(null)}
      />
    );
  }
  if (picker === "client-add") {
    return (
      <AddScreen
        title="Nouveau client"
        fields={CLIENT_FIELDS}
        onCancel={() => setPicker("client")}
        onSave={async (vals) => {
          if (!vals.name.trim()) return;
          const c = await addClient(vals);
          if (c) { set("clientId", c.id); set("client", c.name); set("site", ""); set("equipmentId", ""); set("equipment", ""); }
          setPicker(null);
        }}
      />
    );
  }
  if (picker === "site") {
    const sites = currentClient ? currentClient.sites : [];
    return (
      <ListPicker
        title="Site"
        options={sites}
        value={form.site}
        onSelect={(v) => { set("site", v); setPicker(null); }}
        onDelete={(v) => currentClient && deleteSite(currentClient.id, v)}
        onAdd={currentClient ? () => setPicker("site-add") : null}
        emptyMessage={currentClient ? "Aucun site. Touchez + pour en ajouter un." : "Choisissez d'abord un client."}
        onBack={() => setPicker(null)}
      />
    );
  }
  if (picker === "site-add") {
    return (
      <AddScreen
        title="Nouveau site"
        fields={[{ key: "name", label: "Nom du site", placeholder: "Ex : Paris 15e" }]}
        onCancel={() => setPicker("site")}
        onSave={(vals) => {
          if (!vals.name.trim() || !currentClient) return;
          addSite(currentClient.id, vals.name.trim());
          set("site", vals.name.trim());
          setPicker(null);
        }}
      />
    );
  }
  if (picker === "equipment") {
    return (
      <ListPicker
        title="Equipement"
        options={clientEquipment.map((e) => `${e.code ? e.code + " — " : ""}${e.label}${e.model ? " (" + e.model + ")" : ""}`)}
        value={form.equipment}
        onSelect={(v) => {
          const idx = clientEquipment.findIndex((e) => `${e.code ? e.code + " — " : ""}${e.label}${e.model ? " (" + e.model + ")" : ""}` === v);
          const eq = clientEquipment[idx];
          set("equipment", v); set("equipmentId", eq ? eq.id : "");
          setPicker(null);
        }}
        onDelete={(v) => {
          const idx = clientEquipment.findIndex((e) => `${e.code ? e.code + " — " : ""}${e.label}${e.model ? " (" + e.model + ")" : ""}` === v);
          const eq = clientEquipment[idx];
          if (eq) deleteEquipment(eq.id);
        }}
        onAdd={currentClient ? () => setPicker("equipment-add") : null}
        emptyMessage={currentClient ? "Aucun matériel référencé. Touchez + pour en ajouter un." : "Choisissez d'abord un client."}
        onBack={() => setPicker(null)}
      />
    );
  }
  if (picker === "equipment-add") {
    return (
      <AddScreen
        title="Nouveau matériel"
        fields={[
          { key: "code", label: "Code / Référence", placeholder: "Ex : 25732" },
          { key: "label", label: "Désignation", placeholder: "Ex : Four Rational" },
          { key: "model", label: "Modèle", placeholder: "Ex : SCC101" },
          { key: "serial", label: "Numéro de série", placeholder: "Ex : RTL2026003912" },
        ]}
        onCancel={() => setPicker("equipment")}
        onSave={async (vals) => {
          if (!vals.code.trim() || !vals.label.trim() || !vals.model.trim() || !vals.serial.trim() || !currentClient) return;
          const eq = await addEquipment(currentClient.id, vals.code.trim(), vals.label.trim(), vals.model.trim(), vals.serial.trim());
          if (eq) {
            set("equipment", `${eq.code} — ${eq.label} (${eq.model})`);
            set("equipmentId", eq.id);
          }
          setPicker(null);
        }}
      />
    );
  }
  if (picker === "type") {
    return <ListPicker title="Type Int." options={INT_TYPES} value={form.type} onSelect={(v) => { set("type", v); setPicker(null); }} onBack={() => setPicker(null)} />;
  }
  if (picker === "flags") {
    return (
      <ListPicker
        title="Drapeaux" options={FLAGS} multi value={form.flags}
        onToggle={(v) => set("flags", form.flags.includes(v) ? form.flags.filter((f) => f !== v) : [...form.flags, v])}
        onBack={() => setPicker(null)}
      />
    );
  }
  if (picker === "description") {
    return (
      <div className="flex flex-col h-full">
        <ScreenHeader title="Description" />
        <div className="flex items-center justify-end px-3 py-2 shrink-0" style={{ background: TOOLBAR_GREY }}>
          <button onClick={() => setPicker(null)} className="text-white font-semibold text-[15px]">OK</button>
        </div>
        <textarea autoFocus value={form.description} onChange={(e) => set("description", e.target.value)} className="flex-1 p-3 text-[15px] outline-none resize-none" placeholder="Description de l'intervention…" />
      </div>
    );
  }

  return (
    <>
      <ScreenHeader title={initial ? "Modifier l'intervention" : "Nouvelle intervention"} />
      <div className="flex items-center gap-3 px-3 py-2 shrink-0" style={{ background: TOOLBAR_GREY }}>
        <button onClick={onCancel} className="flex-1 text-white font-semibold text-[15px] rounded-md py-2" style={{ background: "#555f66" }}>Annuler</button>
        <button onClick={() => valid && onSave(form)} disabled={!valid} className="flex-1 text-white font-semibold text-[15px] rounded-md py-2 disabled:opacity-50" style={{ background: GREEN }}>Valider</button>
      </div>
      <div className="flex-1 overflow-y-auto bg-slate-100">
        <div className="bg-white mt-2">
          <Row required label="Client" value={form.client} onClick={() => setPicker("client")} />
          <Row label="Site" value={form.site} onClick={() => setPicker("site")} />
          <Row label="Equipement" value={form.equipment} onClick={() => setPicker("equipment")} />
          <Row required label="Type Int." value={form.type} onClick={() => setPicker("type")} />
          <Row label="Description" value={form.description} onClick={() => setPicker("description")} last />
        </div>
        <div className="bg-white mt-4"><Row label="Drapeaux" value={form.flags.join(", ")} onClick={() => setPicker("flags")} last /></div>
        <div className="bg-white mt-4">
          <div className="flex items-center justify-between px-3 py-3 border-b border-slate-200">
            <span className="text-[15px] text-slate-800">Date</span>
            <input type="date" value={form.date} onChange={(e) => set("date", e.target.value)} className="text-[15px] text-right outline-none" />
          </div>
          <div className="flex items-center justify-between px-3 py-3">
            <span className="text-[15px] text-slate-800">Heure</span>
            <input type="time" value={form.time} onChange={(e) => set("time", e.target.value)} className="text-[15px] text-right outline-none" />
          </div>
        </div>
        {initial && (
          <button onClick={() => onDelete(form.id)} className="w-full flex items-center justify-center gap-2 text-red-600 font-medium text-[15px] py-3 mt-4 mb-6 bg-white">
            🗑 Supprimer l'intervention
          </button>
        )}
      </div>
    </>
  );
}

function Row({ label, value, onClick, required, last }) {
  return (
    <button onClick={onClick} className={`w-full flex items-center justify-between px-3 py-3 active:bg-slate-50 ${last ? "" : "border-b border-slate-200"}`}>
      <span className="text-[15px] text-slate-800 shrink-0">{required && <span className="text-red-500">*</span>}{label}</span>
      <span className="text-[15px] text-slate-400 truncate ml-3 flex items-center gap-1">
        <span className="truncate max-w-[180px]">{value || ""}</span>
        <span className="text-slate-300">›</span>
      </span>
    </button>
  );
}

function ListPicker({ title, options, value, onSelect, onToggle, onBack, multi, onDelete, onAdd, emptyMessage }) {
  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 px-3 py-3 text-white shrink-0 relative" style={{ background: HEADER_DARK }}>
        <button onClick={onBack} className="flex items-center gap-1"><span className="text-xl">‹</span><span className="text-[15px]">Retour</span></button>
        <span className="font-bold text-[17px] flex-1 text-center pr-12">{title}</span>
        {onAdd && <button onClick={onAdd} className="absolute right-3 top-1/2 -translate-y-1/2 text-2xl leading-none">+</button>}
      </div>
      <div className="flex-1 overflow-y-auto bg-white relative">
        {options.length === 0 && emptyMessage && <div className="text-center text-slate-400 text-sm mt-10 px-6">{emptyMessage}</div>}
        {options.map((opt) => {
          const selected = multi ? value.includes(opt) : value === opt;
          const rowContent = (
            <div className="w-full flex items-center justify-between px-3 py-3">
              <span className="text-[15px] text-slate-800">{opt}</span>
              {selected && <span style={{ color: BLUE }}>✓</span>}
            </div>
          );
          if (onDelete) {
            return <SwipeRow key={opt} onDelete={() => onDelete(opt)} onClick={() => (multi ? onToggle(opt) : onSelect(opt))}>{rowContent}</SwipeRow>;
          }
          return (
            <button key={opt} onClick={() => (multi ? onToggle(opt) : onSelect(opt))} className="w-full border-b border-slate-200 active:bg-slate-50 text-left">
              {rowContent}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ClientPicker({ clients, value, onSelect, onDelete, onAdd, onBack }) {
  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 px-3 py-3 text-white shrink-0 relative" style={{ background: HEADER_DARK }}>
        <button onClick={onBack} className="flex items-center gap-1"><span className="text-xl">‹</span><span className="text-[15px]">Retour</span></button>
        <span className="font-bold text-[17px] flex-1 text-center pr-12">Client</span>
        <button onClick={onAdd} className="absolute right-3 top-1/2 -translate-y-1/2 text-2xl leading-none">+</button>
      </div>
      <div className="px-3 py-2 text-[12px] text-slate-400 bg-white border-b border-slate-100">Glissez une fiche vers la gauche pour la supprimer</div>
      <div className="flex-1 overflow-y-auto bg-white">
        {clients.length === 0 && <div className="text-center text-slate-400 text-sm mt-10 px-6">Aucun client. Touchez + pour en ajouter un.</div>}
        {clients.map((c) => (
          <SwipeRow key={c.id} onDelete={() => onDelete(c.id)} onClick={() => onSelect(c)}>
            <div className="w-full flex items-center justify-between px-3 py-3">
              <div className="min-w-0">
                <div className="text-[15px] text-slate-800 truncate">{c.name}</div>
                {(c.address || c.phone) && <div className="text-[12px] text-slate-400 truncate">{[c.address, c.phone].filter(Boolean).join(" · ")}</div>}
              </div>
              {value === c.name && <span style={{ color: BLUE }} className="shrink-0 ml-2">✓</span>}
            </div>
          </SwipeRow>
        ))}
      </div>
    </div>
  );
}

function AddScreen({ title, fields, onCancel, onSave }) {
  const [vals, setVals] = useState(Object.fromEntries(fields.map((f) => [f.key, ""])));
  return (
    <div className="flex flex-col h-full">
      <ScreenHeader title={title} />
      <div className="flex items-center gap-3 px-3 py-2 shrink-0" style={{ background: TOOLBAR_GREY }}>
        <button onClick={onCancel} className="flex-1 text-white font-semibold text-[15px] rounded-md py-2" style={{ background: "#555f66" }}>Annuler</button>
        <button onClick={() => onSave(vals)} className="flex-1 text-white font-semibold text-[15px] rounded-md py-2" style={{ background: GREEN }}>Ajouter</button>
      </div>
      <div className="bg-slate-100 flex-1 p-3 space-y-3">
        {fields.map((f) => (
          <div key={f.key} className="bg-white rounded-md px-3 py-2">
            <div className="text-[11px] text-slate-400">{f.label}</div>
            <input
              autoFocus={fields[0].key === f.key}
              value={vals[f.key]}
              onChange={(e) => setVals((v) => ({ ...v, [f.key]: e.target.value }))}
              placeholder={f.placeholder}
              className="w-full text-[15px] outline-none mt-0.5"
            />
          </div>
        ))}
      </div>
    </div>
  );
}

// ------------------------------------------------------------------ BACKUP
function BackupScreen({ clients, equipment, interventions, onBack }) {
  const exportText = JSON.stringify({ clients, equipment, interventions }, null, 2);
  const taRef = useRef(null);
  useEffect(() => { if (taRef.current) { taRef.current.focus(); taRef.current.select(); } }, []);
  return (
    <div className="flex flex-col h-full">
      <ScreenHeader title="Sauvegarde" onBack={onBack} />
      <div className="flex-1 overflow-y-auto bg-slate-100 p-3 space-y-4">
        <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 text-[13px] rounded-md p-3">
          Tes données sont enregistrées dans une vraie base de données (Supabase). Cette page reste utile comme copie de secours.
        </div>
        <div>
          <div className="text-[13px] font-semibold text-slate-600 mb-1">Exporter (lecture seule)</div>
          <textarea ref={taRef} readOnly value={exportText} className="w-full h-64 bg-white border border-slate-200 rounded-md p-2 text-[11px]" style={{ fontFamily: "JetBrains Mono, monospace" }} />
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
